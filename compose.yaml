services:
  ostinato:
    build:
      context: .
    image: project-ostinato:local
    # Raw USB nodes on common Linux hosts are writable only by root. The
    # cgroup rules below still limit device access to ALSA and USB character
    # devices; the container is not privileged.
    user: "0:0"
    environment:
      OSTINATO_STATE_DIRECTORY: /var/lib/ostinato
      OSTINATO_SOUNDFONT: /usr/share/sounds/sf2/TimGM6mb.sf2
      PIPEWIRE_RUNTIME_DIR: /run/ostinato-pipewire
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
      - type: bind
        source: ${XDG_RUNTIME_DIR:?XDG_RUNTIME_DIR must identify the desktop audio session}/pipewire-0
        target: /run/ostinato-pipewire/pipewire-0
      - type: volume
        source: ostinato-state
        target: /var/lib/ostinato
    device_cgroup_rules:
      - "c 116:* rwm" # ALSA
      - "c 189:* rwm" # USB device filesystem
    ports:
      - "${OSTINATO_WEB_BIND:-127.0.0.1}:${OSTINATO_WEB_PORT:-8765}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stdin_open: true
    tty: true
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  ostinato-state:
