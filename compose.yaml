services:
  ostinato:
    build:
      context: .
    image: project-ostinato:local
    # Raw USB nodes on common Linux hosts are writable only by root. The
    # cgroup rules below still limit device access to ALSA and USB character
    # devices; the container is not privileged.
    user: "0:0"
    environment:
      OSTINATO_STATE_DIRECTORY: /var/lib/ostinato
      OSTINATO_SOUNDFONT: ${OSTINATO_SOUNDFONT:-/usr/share/sounds/sf3/MuseScore_General_Full.sf3}
      OSTINATO_SOUNDFONT_NAME: ${OSTINATO_SOUNDFONT_NAME:-MuseScore General HQ}
      OSTINATO_LEGACY_SOUNDFONT: /usr/share/sounds/sf2/TimGM6mb.sf2
      OSTINATO_SFIZZ_LIBRARY: /usr/local/lib/libsfizz.so
      OSTINATO_WALTZ_SFZ_PIANO: /opt/ostinato-samples/SalamanderGrandPianoV3_44.1khz16bit/SalamanderGrandPianoV3.sfz
      OSTINATO_WALTZ_SFZ_BASS: /opt/ostinato-samples/Meatbass/Programs/04_pizz.sfz
      OSTINATO_WALTZ_SFZ_FLUTE: /opt/ostinato-samples/VSCO2/FluteSusVib.sfz
      OSTINATO_WALTZ_SFZ_CELLO: /opt/ostinato-samples/VSCO2/CelloEnsSusVib-Quiet.sfz
      OSTINATO_WALTZ_SFZ_VIOLIN: /opt/ostinato-samples/VSCO2/SViolinVib-Quiet.sfz
      OSTINATO_WALTZ_SFZ_DRUMS: /opt/ostinato-samples/Swirly Drums/Programs/Basic_kit.sfz
      OSTINATO_STYLE_SFZ_ACOUSTIC_GUITAR: /opt/ostinato-samples/Shinyguitar/Programs/acoustic-main.sfz
      OSTINATO_STYLE_SFZ_ELECTRIC_GUITAR: /opt/ostinato-samples/Shinyguitar/Programs/main.sfz
      OSTINATO_STYLE_SFZ_ELECTRIC_BASS_FINGER: /opt/ostinato-samples/Black Blue Basses/Programs/05-darkblack_pluck.sfz
      OSTINATO_STYLE_SFZ_ELECTRIC_BASS_PICK: /opt/ostinato-samples/Black Blue Basses/Programs/03-babyblue_all.sfz
      OSTINATO_STYLE_SFZ_DRUM_KIT: /opt/ostinato-samples/Virtuosity Drums/Programs/02-full-kit.sfz
      OSTINATO_STYLE_SFZ_CLARINET: /opt/ostinato-samples/VSCO2/ClarinetStac.sfz
      OSTINATO_STYLE_SFZ_TRUMPET: /opt/ostinato-samples/VSCO2/TrumpetStac.sfz
      PIPEWIRE_RUNTIME_DIR: /run/ostinato-pipewire
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
      - type: bind
        source: ${XDG_RUNTIME_DIR:?XDG_RUNTIME_DIR must identify the desktop audio session}/pipewire-0
        target: /run/ostinato-pipewire/pipewire-0
      - type: volume
        source: ostinato-state
        target: /var/lib/ostinato
    device_cgroup_rules:
      - "c 116:* rwm" # ALSA
      - "c 189:* rwm" # USB device filesystem
    ports:
      - "${OSTINATO_WEB_BIND:-127.0.0.1}:${OSTINATO_WEB_PORT:-8765}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stdin_open: true
    tty: true
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  ostinato-state:
