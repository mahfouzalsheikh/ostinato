[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ostinato"
version = "0.1.0"
description = "Linux proof of concept for an FR-4X live arranger"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Project Ostinato contributors" }]
dependencies = []

[project.optional-dependencies]
midi = [
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
  "PyYAML>=6,<7",
]
web = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
  "httpx2>=2.12,<3",
]

[project.scripts]
ostinato = "ostinato.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ostinato = ["web_static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
